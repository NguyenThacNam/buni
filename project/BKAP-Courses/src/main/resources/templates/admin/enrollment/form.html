<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: page(
            ${enrollment.id != null} ? 'Sửa ghi danh' : 'Ghi danh học viên',
            'Gán học viên vào khóa học và theo dõi tiến độ', 'enrollment', ~{::main})}">
<body>
<main>

    <div class="card">
        <div class="card__head">
            <h2 th:text="${enrollment.id != null} ? 'Cập nhật lượt ghi danh' : 'Lượt ghi danh mới'">Thông tin</h2>
        </div>

        <div class="card__body">
            <form th:action="@{/admin/enrollment/save}" th:object="${enrollment}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="form-grid">
                    <!-- Không dùng th:field cho hai select này: th:field so chuỗi id với
                         object User/Course nên không bao giờ khớp, dropdown sẽ luôn nhảy
                         về mục đầu tiên. Đây đúng là lỗi đã gặp ở form khóa học.
                         @InitBinder trong AdminEnrollmentController lo phần đổi id -> object. -->
                    <div class="form-group">
                        <label>Học viên</label>
                        <select name="user" required>
                            <option value="">— Chọn học viên —</option>
                            <option th:each="u : ${users}"
                                    th:value="${u.id}"
                                    th:text="${u.fullname} + ' (' + ${u.username} + ')'"
                                    th:selected="${enrollment.user != null and enrollment.user.id == u.id}">
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Khóa học</label>
                        <select name="course" required>
                            <option value="">— Chọn khóa học —</option>
                            <option th:each="c : ${courses}"
                                    th:value="${c.id}"
                                    th:text="${c.title}"
                                    th:selected="${enrollment.course?.id == c.id}">
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Trạng thái</label>
                        <select th:field="*{status}">
                            <option value="ENROLLED">Mới ghi danh</option>
                            <option value="IN_PROGRESS">Đang học</option>
                            <option value="COMPLETED">Hoàn thành</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Tiến độ (%)</label>
                        <input type="number" th:field="*{progressPercent}" min="0" max="100">
                        <span class="hint">Từ 0 đến 100.</span>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn--primary">Lưu</button>
                    <a th:href="@{/admin/enrollment}" class="btn btn--ghost">Hủy</a>
                </div>
            </form>
        </div>
    </div>

</main>
</body>
</html>
