<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: page('Danh mục', 'Nhóm khóa học theo lĩnh vực', 'category', ~{::main})}">
<body>
<main>

    <div class="toolbar">
        <a th:href="@{/admin/category/create}" class="btn btn--primary">+ Thêm danh mục</a>
        <div th:replace="~{admin/fragments :: oTimKiem('/admin/category', ${q}, 'Tìm theo tên hoặc slug…')}"></div>
        <div class="toolbar__spacer"></div>
        <div th:replace="~{admin/fragments :: tomTat(${trang}, ${q})}"></div>
    </div>

    <div class="card">
        <div class="table-wrap" th:if="${!categories.isEmpty()}">
            <table class="data">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Tên danh mục</th>
                    <th>Thuộc danh mục</th>
                    <th>Slug</th>
                    <th>Trạng thái</th>
                    <th class="num">Ưu tiên</th>
                    <th>Hành động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="category : ${categories}">
                    <td th:text="${category.id}"></td>
                    <td>
                        <div class="cell-title" th:text="${category.name}"></div>
                        <div class="cell-sub" th:if="${category.moodleCategoryId != null}">Đồng bộ từ LMS</div>
                    </td>
                    <td>
                        <span th:if="${category.parentId != null}" th:text="${tenDayDu.get(category.parentId)}"></span>
                        <span class="cell-sub" th:if="${category.parentId == null}">— gốc —</span>
                    </td>
                    <td class="cell-sub" th:text="${category.slug}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${category.status == 'active'} ? 'badge--ok' : 'badge--muted'"
                              th:text="${category.status == 'active'} ? 'Đang hiện' : 'Đang ẩn'"></span>
                    </td>
                    <td class="num" th:text="${category.prioty}"></td>
                    <td>
                        <div class="row-actions">
                            <a th:href="@{/admin/category/edit/{id}(id=${category.id})}">Sửa</a>
                            <span class="sep">|</span>
                            <!-- Xóa phải đi bằng POST. Nếu để thẻ <a> (GET) thì bất kỳ thứ gì
                                 duyệt link cũng xóa được: bot tìm kiếm, trình quét bảo mật,
                                 tính năng tải trước của trình duyệt. Hộp confirm chỉ chặn
                                 được người thật, không chặn được máy. -->
                            <form th:action="@{/admin/category/delete/{id}(id=${category.id})}" method="post"
                                  style="display:inline;"
                                  onsubmit="return confirm('Bạn có chắc muốn xóa danh mục này?');">
                                <button type="submit" class="btn-link btn-link--danger">Xóa</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="empty" th:if="${categories.isEmpty()}">
            <div class="empty__icon">◈</div>
            <div class="empty__title"
                 th:text="${q != null and !q.isEmpty()} ? 'Không tìm thấy danh mục nào' : 'Chưa có danh mục nào'">
            </div>
        </div>

        <div th:replace="~{admin/fragments :: phanTrang(${trang}, '/admin/category', ${q})}"></div>
    </div>

</main>
</body>
</html>
