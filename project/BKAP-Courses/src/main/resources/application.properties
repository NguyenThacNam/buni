spring.application.name=BKAP-Courses

# -----------------------
# Bí mật: nằm ở file riêng, KHÔNG đưa lên git
# -----------------------
# Mật khẩu CSDL, token Moodle và khóa ký JWT nằm trong secrets.properties
# (cùng thư mục này). File đó được .gitignore bỏ qua; mẫu các khóa cần điền nằm
# ở secrets.properties.example.
#
# Vẫn nằm trong resources/ nên đóng gói jar trên máy có file này thì jar chạy y
# như cũ. Clone về máy mới mà quên tạo file thì ứng dụng dừng ngay lúc khởi động
# vì thiếu khóa — cố ý như vậy: chạy với khóa JWT rỗng hay mặc định còn nguy
# hiểm hơn, vì ai cũng tự ký được token quản trị.
spring.config.import=optional:classpath:secrets.properties

# -----------------------
# CORS
# -----------------------
# Danh sách origin được phép gọi API từ trình duyệt. Ngăn cách bằng dấu phẩy,
# KHÔNG có dấu cách và KHÔNG có dấu / ở cuối — phải khớp tuyệt đối phần
# scheme + host + port thì Spring mới chấp nhận.
#
#   http://localhost:3001  — React dev server (npm start)
#   http://buni.vn         — bản FE đang chạy thật
#   https://buni.vn        — dự phòng cho khi buni.vn bật HTTPS
#
# Khi FE được build vào static/ của chính Spring Boot thì hai bên cùng origin,
# lúc đó không cần khai gì ở đây cả.
app.cors.allowed-origins=http://localhost:3001,http://buni.vn,https://buni.vn

# -----------------------
# Database
# -----------------------
# PostgreSQL không có tùy chọn kiểu createDatabaseIfNotExist của MySQL —
# phải tạo database trước: createdb bkap_courses
# rồi nạp schema: psql -d bkap_courses -f ../bkap-ai-courses.sql
spring.datasource.url=jdbc:postgresql://localhost:5432/bkap_courses
spring.datasource.username=postgres
# spring.datasource.password -> secrets.properties

# -----------------------
# Naming entity mapping table in SQL
# -----------------------
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# -----------------------
# Show sql
# -----------------------
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# Moodle Integration
# Địa chỉ gốc của Moodle — dùng để dựng link tới trang khóa học sau khi SSO
moodle.site-url=https://lms.buni.vn
moodle.base-url=https://lms.buni.vn/webservice/rest/server.php
# moodle.token -> secrets.properties
moodle.ws-format=json

# ==============================================================================
# Cấu hình JWT SSO (Thêm mới đoạn này)
# ==============================================================================
# Khóa bí mật dùng chung giữa Spring Boot và plugin JWT trên Moodle (Độ dài tối thiểu 32 ký tự)
# moodle.jwt.secret -> secrets.properties
# ==============================================================================
# Chạy sau reverse proxy (nginx / Apache)
# ==============================================================================
# Triệu chứng nếu thiếu: deploy lên tên miền, bấm Lưu trong trang admin xong bị
# đẩy về http://localhost:9090/... Nguyên nhân: controller trả "redirect:/admin/..."
# là đường dẫn tương đối, Tomcat tự ghép thành URL tuyệt đối dựa trên host/port
# mà NÓ nhìn thấy — đứng sau proxy thì đó là localhost, không phải tên miền thật.

# Trả về Location tương đối, để trình duyệt tự ghép với URL đang đứng.
# Cách này đúng kể cả khi proxy không gửi header X-Forwarded-*.
server.tomcat.use-relative-redirects=true

# Ngoài ra, tin các header X-Forwarded-Proto / X-Forwarded-Host / X-Forwarded-Port
# do proxy gửi sang, để app biết địa chỉ thật bên ngoài.
# Chỉ bật khi app THỰC SỰ nằm sau proxy mà mình kiểm soát — nếu app phơi thẳng ra
# Internet thì client có thể tự bịa header này.
server.forward-headers-strategy=native

# ==============================================================================
# Tải ảnh lên
# ==============================================================================
# Thư mục thật trên ổ đĩa để chứa ảnh admin tải lên. KHÔNG để trong resources/
# vì hai lý do: static/ bị script deploy React xoá sạch, còn khi chạy bằng .jar
# thì nội dung jar là chỉ đọc.
# Thư mục này nằm ngoài mã nguồn — nhớ giữ lại khi deploy bản mới và backup
# cùng với database.
app.upload.dir=./uploads

# Giới hạn dung lượng. Mặc định của Spring Boot chỉ 1MB, ảnh bìa khóa học
# thường vượt ngưỡng đó.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ==============================================================================
# JWT: access token + refresh token
# ==============================================================================
# Khóa ký access token. Trước đây viết cứng trong JwtUtil.java; đưa ra đây để
# đổi trên máy chủ không phải build lại jar.
# Giữ nguyên giá trị cũ để các token đang lưu hành không bị vô hiệu đột ngột.
# app.jwt.secret -> secrets.properties

# Access token: hạn NGẮN. JWT stateless nên không thu hồi được — lộ ra thì cách
# duy nhất giới hạn thiệt hại là cho nó chết nhanh. Người dùng không bị phiền vì
# frontend tự động dùng refresh token xin cái mới.
app.jwt.access-token-minutes=15

# Refresh token: hạn DÀI, nhưng lưu trong bảng refresh_token nên thu hồi được
# thật khi đăng xuất. Hết 7 ngày không hoạt động thì phải đăng nhập lại.
app.jwt.refresh-token-days=7
